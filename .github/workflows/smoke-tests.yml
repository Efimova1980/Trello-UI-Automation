name: Smoke tests

env:
  TRELLO_EMAIL: ${{ secrets.TRELLO_EMAIL }}
  TRELLO_PASSWORD: ${{ secrets.TRELLO_PASSWORD }}
  TRELLO_TOTP_SECRET: ${{ secrets.TRELLO_TOTP_SECRET }}

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Force Sync Clock (Windows)
        shell: powershell
        run: |
          Set-Service -Name w32time -StartupType Automatic
          Start-Service -Name w32time -ErrorAction SilentlyContinue
          w32tm /config /manualpeerlist:"time.google.com,0x8" /syncfromflags:manual /update
          Restart-Service -Name w32time
          w32tm /resync /force

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run smoke tests (boards, then avatar)
        run: .\gradlew clean smoketests

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/smoketests/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/